name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run DSP unit tests
        run: cargo test

      - name: Build release VST3 & CLAP bundles
        run: cargo xtask bundle a9_strip --release

      - name: Extract version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') {
            $ver = $Matches[1]
          } else {
            $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
            $tag = "v$ver"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          & $iscc "/DMyAppVersion=${{ steps.meta.outputs.version }}" "installer\a9_strip.iss"

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "target\installer" | Out-Null
          Compress-Archive -Force `
            -Path "target\bundled\A9 Strip.vst3", "target\bundled\A9 Strip.clap", "README.md", "LICENSE" `
            -DestinationPath "target\installer\A9-Strip-v${{ steps.meta.outputs.version }}-Windows-Portable.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "A9 Strip ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          body: |
            ## A9 Strip ${{ steps.meta.outputs.tag }} — Pioneer DJM-A9 Channel Strip (VST3 / CLAP)

            ### Downloads
            - **`A9-Strip-v${{ steps.meta.outputs.version }}-Windows-Setup.exe`** — Standard Windows installer (automatically installs VST3 to `C:\Program Files\Common Files\VST3` and optionally CLAP to `C:\Program Files\Common Files\CLAP`, with uninstaller).
            - **`A9-Strip-v${{ steps.meta.outputs.version }}-Windows-Portable.zip`** — Portable zip for manual installation.

            ### Highlights
            - Exact Pioneer DJM-A9 signal flow: **Trim → 3-Band EQ/Isolator → Sound Color FX → Channel Fader → Soft Clipper**
            - **All 6 DJM-A9 Sound Color FX:** `SPACE`, `DUB ECHO`, `SWEEP`, `NOISE`, `CRUSH`, and `FILTER` with `PARAMETER` knob & `CTR LOCK`
            - 64-bit internal floating-point DSP (`f64`) with zero audio-thread allocations
          files: |
            target/installer/A9-Strip-v${{ steps.meta.outputs.version }}-Windows-Setup.exe
            target/installer/A9-Strip-v${{ steps.meta.outputs.version }}-Windows-Portable.zip
